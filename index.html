<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Wishes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand"><i class="fa-solid fa-wand-magic-sparkles"></i> Wishes</div>
  <div class="spacer"></div>
  <button id="langToggle" class="btn ghost small">EN</button>
  <button id="signInGoogle" class="btn google small hidden">
    <i class="fa-brands fa-google"></i> Google
  </button>
  <button id="shareProfileBtn" class="btn ghost small hidden">
    <i class="fa-solid fa-link"></i>
    <span data-i18n="shareProfile">Share</span>
  </button>
  <button id="profileBtn" class="profile-chip hidden">
    <span id="myAvatarWrap"><span class="avatar sm">?</span></span>
    <span id="myName">Guest</span>
  </button>
</header>

<main class="container">

  <!-- Auth gate -->
  <section id="authGate" class="card auth-box hidden">
    <div class="brand" style="font-size:1.8rem; margin-bottom:12px;">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Wishes
    </div>
    <h2 data-i18n="authTitle">স্বাগতম!</h2>
    <p data-i18n="authSubtitle">আপনার উইশ শেয়ার করতে সাইন ইন করুন</p>
    <button id="googleSignInBtn" class="btn google" style="margin:0 auto 10px;">
      <i class="fa-brands fa-google"></i>
      <span data-i18n="signInGoogle">Google দিয়ে সাইন ইন</span>
    </button>
    <button id="guestSignInBtn" class="btn ghost" style="width:100%;">
      <span data-i18n="continueGuest">অতিথি হিসেবে চালিয়ে যান</span>
    </button>
  </section>

  <!-- Main app -->
  <div id="appMain" class="hidden">

    <section class="composer card">
      <textarea id="wishText" maxlength="1000" data-i18n-placeholder="postPlaceholder"
        placeholder="আপনার উইশ লিখুন..."></textarea>

      <div id="previewWrap" class="preview-wrap hidden">
        <img id="previewImg" alt="">
        <button class="remove" id="removeImg" title="Remove">✕</button>
      </div>

      <div class="composer-row">
        <label class="file-btn">
          <i class="fa-regular fa-image"></i>
          <span data-i18n="image">ছবি</span>
          <input type="file" id="imageInput" accept="image/*" hidden>
        </label>
        <label class="check"><input type="checkbox" id="anonToggle">
          <span data-i18n="anonymous">বেনামী</span>
        </label>
        <label class="check"><input type="checkbox" id="profileCardToggle">
          <span data-i18n="attachProfile">প্রোফাইল যুক্ত</span>
        </label>
        <div class="spacer"></div>
        <button id="postBtn" class="btn primary" data-i18n="postWish">উইশ পোস্ট করুন</button>
      </div>
    </section>

    <div id="filterBanner" class="banner hidden"></div>

    <section id="feed"></section>
  </div>
</main>

<!-- Profile modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h3 data-i18n="myProfile">আমার প্রোফাইল</h3>
    <div class="modal-avatar"><span id="modalAvatar"></span></div>

    <label class="field">
      <span data-i18n="displayName">প্রদর্শিত নাম</span>
      <input id="nameInput" maxlength="30" placeholder="Your name">
    </label>

    <label class="field">
      <span data-i18n="avatarImage">প্রোফাইল ছবি</span>
      <input type="file" id="avatarInput" accept="image/*">
    </label>

    <div class="row end">
      <button class="btn ghost" id="closeModal" data-i18n="cancel">বাতিল</button>
      <button class="btn primary" id="saveProfile" data-i18n="save">সেভ</button>
    </div>
    <div class="row" style="justify-content:center; margin-top:14px;">
      <button class="btn ghost small hidden" id="signOutBtn" data-i18n="signOut">সাইন আউট</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
