<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wishes ✨ — Share your wishes</title>
<style>
  :root{
    --bg:#0d0e1a;
    --card:#171832;
    --card2:#1f2040;
    --text:#ecedf7;
    --muted:#9295b8;
    --accent:#7c5cff;
    --accent2:#ff5c8a;
    --border:#2a2c50;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',sans-serif;
    background:
      radial-gradient(900px 500px at 8% -8%, #2b1f63 0%, transparent 60%),
      radial-gradient(800px 460px at 100% 0%, #4c1c46 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  textarea,input{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; gap:10px;
    padding:12px 16px;
    background:rgba(13,14,26,.75);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{
    font-size:1.3rem; font-weight:800; letter-spacing:.3px;
    background:linear-gradient(90deg,#a78bfa,#ff7ab6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .spacer{flex:1;}

  .btn{
    border:1px solid transparent; border-radius:12px;
    padding:9px 16px; font-size:.9rem; font-weight:600;
    transition:.18s; white-space:nowrap;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; box-shadow:0 6px 18px -6px var(--accent);
  }
  .btn.primary:hover{filter:brightness(1.12); transform:translateY(-1px);}
  .btn.ghost{background:transparent; color:var(--muted); border-color:var(--border);}
  .btn.ghost:hover{color:var(--text); border-color:var(--accent);}
  .btn.small{padding:6px 12px; font-size:.8rem; border-radius:9px;}
  .btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}

  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--card2); border:1px solid var(--border);
    border-radius:999px; padding:5px 14px 5px 5px; color:var(--text);
    font-weight:600; font-size:.85rem; transition:.18s;
  }
  .profile-chip:hover{border-color:var(--accent);}

  /* ---------- Avatars ---------- */
  .avatar{
    width:40px; height:40px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem; color:#fff; overflow:hidden;
    background:#3b3d68;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar.sm{width:26px;height:26px;font-size:.72rem;}

  /* ---------- Layout ---------- */
  .container{max-width:680px; margin:0 auto; padding:20px 14px 80px;}

  .card{
    background:linear-gradient(180deg,var(--card),#141530);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 18px 40px -28px #000;
  }

  /* ---------- Composer ---------- */
  .composer{padding:16px; margin-bottom:18px;}
  .composer textarea{
    width:100%; min-height:92px; resize:vertical;
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:1.02rem; line-height:1.55;
  }
  .composer textarea::placeholder{color:#5d6088;}

  .preview-wrap{position:relative; margin:10px 0;}
  .preview-wrap img{
    width:100%; max-height:280px; object-fit:cover;
    border-radius:12px; border:1px solid var(--border); display:block;
  }
  .preview-wrap .remove{
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,.65); color:#fff; border:none;
    width:30px; height:30px; border-radius:50%; font-size:1rem; line-height:1;
  }

  .composer-row{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border-top:1px solid var(--border); padding-top:12px; margin-top:6px;
  }
  .file-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.85rem; font-weight:600; color:var(--muted);
    border:1px dashed var(--border); border-radius:10px;
    padding:7px 12px; cursor:pointer; transition:.18s;
  }
  .file-btn:hover{color:var(--text); border-color:var(--accent);}
  .check{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.83rem; color:var(--muted); cursor:pointer; user-select:none;
  }
  .check input{accent-color:var(--accent); width:15px; height:15px;}

  /* ---------- Banner ---------- */
  .banner{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(255,92,138,.16));
    border:1px solid var(--border); border-radius:14px;
    padding:12px 16px; margin-bottom:16px; font-size:.9rem;
  }

  /* ---------- Post ---------- */
  .post{padding:16px; margin-bottom:16px; animation:pop .28s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .post-head{display:flex; align-items:center; gap:11px;}
  .post-meta{flex:1; min-width:0;}
  .post-name{font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:6px;}
  .post-time{font-size:.76rem; color:var(--muted); margin-top:2px;}
  .tag{
    font-size:.62rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    background:rgba(255,92,138,.18); color:#ff9dc0;
    padding:2px 7px; border-radius:99px;
  }
  .icon-btn{
    background:transparent; border:none; font-size:.95rem;
    padding:6px; border-radius:8px; opacity:.7; transition:.15s;
  }
  .icon-btn:hover{opacity:1; background:var(--card2);}

  .post-body{
    margin-top:13px; font-size:1rem; line-height:1.65;
    word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap;
  }
  .post-image{margin-top:13px;}
  .post-image img{
    width:100%; max-height:460px; object-fit:cover;
    border-radius:13px; border:1px solid var(--border); display:block;
  }

  .profile-card{
    margin-top:13px; padding:11px 13px; border-radius:13px;
    background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(255,92,138,.10));
    border:1px solid var(--border);
  }
  .pc-label{
    font-size:.65rem; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }
  .pc-row{display:flex; align-items:center; gap:11px; margin-top:8px;}
  .pc-name{font-weight:700; font-size:.92rem;}
  .pc-link{font-size:.78rem; color:#a78bfa; text-decoration:none;}
  .pc-link:hover{text-decoration:underline;}

  .post-stats{
    display:flex; gap:14px; margin-top:12px;
    font-size:.76rem; color:var(--muted);
  }

  .post-actions{
    display:flex; gap:6px; margin-top:10px;
    border-top:1px solid var(--border); padding-top:10px;
  }
  .act{
    flex:1; background:transparent; border:none; border-radius:10px;
    padding:8px 6px; font-size:.84rem; font-weight:600; color:var(--muted);
    transition:.15s;
  }
  .act:hover{background:var(--card2); color:var(--text);}
  .act.liked{color:#ff6b9d;}

  /* ---------- Edit box ---------- */
  .edit-box{margin-top:12px;}
  .edit-box textarea{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:11px; color:var(--text); padding:11px 13px;
    font-size:.95rem; resize:vertical; outline:none;
  }
  .edit-box textarea:focus{border-color:var(--accent);}
  .row{display:flex; gap:8px; margin-top:9px; align-items:center;}
  .row.end{justify-content:flex-end;}

  /* ---------- Comments ---------- */
  .comments{
    margin-top:14px; border-top:1px solid var(--border); padding-top:13px;
  }
  .comment-form{display:flex; gap:8px; align-items:flex-start; margin-bottom:13px;}
  .comment-input{
    flex:1; background:var(--card2); border:1px solid var(--border);
    border-radius:11px; padding:9px 13px; color:var(--text);
    font-size:.88rem; resize:vertical; outline:none; min-height:40px;
  }
  .comment-input:focus{border-color:var(--accent);}
  .comment-input::placeholder{color:#5d6088;}

  .c-children{margin-left:18px; padding-left:12px; border-left:2px solid var(--border);}
  .c-children .c-children .c-children{margin-left:8px;}
  .comment{padding:9px 0;}
  .c-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .c-name{font-weight:700; font-size:.83rem;}
  .c-time{font-size:.72rem; color:var(--muted);}
  .c-body{
    margin:6px 0 0 34px; font-size:.88rem; line-height:1.55;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .c-actions{display:flex; gap:12px; margin:6px 0 0 34px;}
  .c-actions button{
    background:none; border:none; padding:0; font-size:.74rem;
    font-weight:600; color:var(--muted); transition:.15s;
  }
  .c-actions button:hover{color:var(--accent);}
  .c-reply{margin:9px 0 4px 34px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:200;
    background:rgba(5,5,14,.72); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal{
    width:100%; max-width:400px; padding:22px;
    background:linear-gradient(180deg,var(--card),#131428);
    border:1px solid var(--border); border-radius:20px;
    box-shadow:0 30px 70px -30px #000;
    animation:pop .22s ease;
  }
  .modal h3{margin:0 0 16px; font-size:1.1rem;}
  .modal-avatar{display:flex; justify-content:center; margin-bottom:16px;}
  .modal-avatar .avatar{width:74px; height:74px; font-size:1.7rem;}
  .field{display:block; margin-bottom:14px;}
  .field span{display:block; font-size:.78rem; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input[type=text], .field input:not([type]){
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:11px; padding:10px 13px; color:var(--text);
    font-size:.92rem; outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .field input[type=file]{font-size:.82rem; color:var(--muted);}

  /* ---------- Misc ---------- */
  .muted{color:var(--muted);}
  .small{font-size:.82rem;}
  .empty{
    text-align:center; padding:56px 20px; color:var(--muted);
    border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty .big{font-size:2.6rem; display:block; margin-bottom:10px;}

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,140%);
    background:#242649; color:#fff; padding:11px 22px; border-radius:99px;
    font-size:.86rem; font-weight:600; border:1px solid var(--border);
    box-shadow:0 14px 34px -14px #000; z-index:500; transition:transform .32s cubic-bezier(.2,.9,.3,1.3);
  }
  #toast.show{transform:translate(-50%,0);}

  @media (max-width:520px){
    .composer-row{gap:10px;}
    .act{font-size:.78rem;}
    .profile-chip span#myName{display:none;}
    .profile-chip{padding:5px;}
  }
</style>
</head>
<body>

<!-- ============ TOPBAR ============ -->
<header class="topbar">
  <div class="brand">✨ Wishes</div>
  <div class="spacer"></div>
  <button id="shareProfileBtn" class="btn ghost small">🔗 Share Profile</button>
  <button id="profileBtn" class="profile-chip">
    <span class="avatar sm" id="myAvatar">?</span>
    <span id="myName">Guest</span>
  </button>
</header>

<!-- ============ MAIN ============ -->
<main class="container">

  <!-- Composer -->
  <section class="composer card">
    <textarea id="wishText" maxlength="1000" placeholder="Apnar wish likhun... ✨"></textarea>

    <div id="previewWrap" class="preview-wrap hidden">
      <img id="previewImg" alt="preview">
      <button class="remove" id="removeImg" title="Remove">✕</button>
    </div>

    <div class="composer-row">
      <label class="file-btn">
        🖼️ Image
        <input type="file" id="imageInput" accept="image/*" hidden>
      </label>
      <label class="check"><input type="checkbox" id="anonToggle"> Anonymous</label>
      <label class="check"><input type="checkbox" id="profileCardToggle"> Attach profile</label>
      <div class="spacer"></div>
      <button id="postBtn" class="btn primary">Post Wish</button>
    </div>
  </section>

  <!-- Filter banner -->
  <div id="filterBanner" class="banner hidden"></div>

  <!-- Feed -->
  <section id="feed"></section>
</main>

<!-- ============ PROFILE MODAL ============ -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h3>My Profile</h3>
    <div class="modal-avatar"><span id="modalAvatar"></span></div>

    <label class="field">
      <span>Display Name</span>
      <input id="nameInput" maxlength="30" placeholder="Your name">
    </label>

    <label class="field">
      <span>Avatar Image</span>
      <input type="file" id="avatarInput" accept="image/*">
    </label>

    <div class="row end">
      <button class="btn ghost" id="closeModal">Cancel</button>
      <button class="btn primary" id="saveProfile">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- ============ APP ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  getDoc, getDocs, setDoc, onSnapshot, query, orderBy,
  serverTimestamp, arrayUnion, arrayRemove, increment
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

/* ---------------- Firebase init ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAKbFYxRaZLn0NZwgL7HF4JHBGlwT5BIjc",
  authDomain: "wishes-726f9.firebaseapp.com",
  projectId: "wishes-726f9",
  storageBucket: "wishes-726f9.firebasestorage.app",
  messagingSenderId: "341661769706",
  appId: "1:341661769706:web:8b18d096c1c08bcd449c93",
  measurementId: "G-78M565LVHH"
};

const app     = initializeApp(firebaseConfig);
const auth    = getAuth(app);
const db      = getFirestore(app);
const storage = getStorage(app);

/* ---------------- State ---------------- */
let currentUser   = null;
let myProfile     = { name: 'Guest', photo: '' };
let allPosts      = [];
let selectedFile  = null;
let avatarFile    = null;

let filterUid     = new URLSearchParams(location.search).get('user') || null;
const openComments  = new Set();     // postId gulo jader comment box khola
const commentsCache = new Map();     // postId -> [comments]
const commentUnsubs = new Map();     // postId -> unsubscribe fn
const drafts        = new Map();     // "postId:parentKey" -> text
const renderedSigs  = new Map();     // postId -> signature

/* ---------------- DOM ---------------- */
const $ = (id) => document.getElementById(id);
const feed          = $('feed');
const wishText      = $('wishText');
const imageInput    = $('imageInput');
const previewWrap   = $('previewWrap');
const previewImg    = $('previewImg');
const anonToggle    = $('anonToggle');
const profileToggle = $('profileCardToggle');
const postBtn       = $('postBtn');
const filterBanner  = $('filterBanner');
const toastEl       = $('toast');

/* ---------------- Helpers ---------------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function timeAgo(ts){
  if (!ts) return 'just now';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 45)      return 'just now';
  if (s < 3600)    return Math.floor(s / 60) + 'm ago';
  if (s < 86400)   return Math.floor(s / 3600) + 'h ago';
  if (s < 604800)  return Math.floor(s / 86400) + 'd ago';
  return d.toLocaleDateString();
}

function avatarHTML(name, photo, cls = ''){
  if (photo) return `<span class="avatar ${cls}"><img src="${esc(photo)}" alt=""></span>`;
  const ch  = (name || '?').trim().charAt(0).toUpperCase() || '?';
  const hue = [...(name || 'x')].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return `<span class="avatar ${cls}" style="background:hsl(${hue} 58% 42%)">${esc(ch)}</span>`;
}

/* ---------------- Auth ---------------- */
onAuthStateChanged(auth, async (user) => {
  if (!user){ await signInAnonymously(auth); return; }
  currentUser = user;
  await loadProfile();
  startFeed();
  buildFilterBanner();
});

/* ---------------- Profile ---------------- */
async function loadProfile(){
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()){
      myProfile = {
        name : snap.data().name  || 'Guest',
        photo: snap.data().photo || ''
      };
    } else {
      myProfile = { name: 'Guest-' + currentUser.uid.slice(0, 4).toUpperCase(), photo: '' };
      await setDoc(doc(db, 'users', currentUser.uid), {
        ...myProfile, createdAt: serverTimestamp()
      });
    }
  } catch (e){
    console.error(e);
    myProfile = { name: 'Guest', photo: '' };
  }
  renderMyChip();
}

function renderMyChip(){
  $('myAvatar').outerHTML = avatarHTML(myProfile.name, myProfile.photo, 'sm')
    .replace('class="avatar sm"', 'class="avatar sm" id="myAvatar"');
  $('myName').textContent = myProfile.name;
}

/* Profile modal */
$('profileBtn').addEventListener('click', () => {
  avatarFile = null;
  $('nameInput').value = myProfile.name;
  $('avatarInput').value = '';
  $('modalAvatar').innerHTML = avatarHTML(myProfile.name, myProfile.photo);
  $('modalBackdrop').classList.remove('hidden');
});
$('closeModal').addEventListener('click', () => $('modalBackdrop').classList.add('hidden'));
$('modalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') $('modalBackdrop').classList.add('hidden');
});
$('avatarInput').addEventListener('change', () => {
  const f = $('avatarInput').files[0];
  if (!f) return;
  avatarFile = f;
  $('modalAvatar').innerHTML = `<span class="avatar"><img src="${URL.createObjectURL(f)}" alt=""></span>`;
});
$('saveProfile').addEventListener('click', async () => {
  const name = $('nameInput').value.trim() || myProfile.name;
  const btn = $('saveProfile');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    let photo = myProfile.photo;
    if (avatarFile){
      const path = `avatars/${currentUser.uid}/${Date.now()}_${avatarFile.name}`;
      const r = sRef(storage, path);
      await uploadBytes(r, avatarFile);
      photo = await getDownloadURL(r);
    }
    await setDoc(doc(db, 'users', currentUser.uid),
      { name, photo, updatedAt: serverTimestamp() }, { merge: true });
    myProfile = { name, photo };
    renderMyChip();
    $('modalBackdrop').classList.add('hidden');
    toast('Profile updated ✅');
  } catch (e){
    console.error(e);
    toast('Profile save korte problem holo');
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
});

/* Share profile */
$('shareProfileBtn').addEventListener('click', async () => {
  if (!currentUser) return;
  const url = `${location.origin}${location.pathname}?user=${currentUser.uid}`;
  try {
    await navigator.clipboard.writeText(url);
    toast('Profile link copied! 🔗');
  } catch {
    prompt('Copy this link:', url);
  }
});

/* ---------------- Filter banner ---------------- */
async function buildFilterBanner(){
  if (!filterUid) { filterBanner.classList.add('hidden'); return; }
  let name = 'a user';
  try {
    const s = await getDoc(doc(db, 'users', filterUid));
    if (s.exists()) name = s.data().name || name;
  } catch {}
  filterBanner.innerHTML = `
    <span>🔎 Showing wishes from <b>${esc(name)}</b></span>
    <div class="spacer"></div>
    <button class="btn ghost small" id="clearFilter">Show all</button>`;
  filterBanner.classList.remove('hidden');
  $('clearFilter').addEventListener('click', () => {
    filterUid = null;
    history.replaceState(null, '', location.pathname);
    filterBanner.classList.add('hidden');
    renderedSigs.clear();
    feed.innerHTML = '';
    renderFeed();
  });
}

/* ---------------- Feed ---------------- */
let feedUnsub = null;

function startFeed(){
  if (feedUnsub) return;
  const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
  feedUnsub = onSnapshot(q, (snap) => {
    allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFeed();
  }, (err) => {
    console.error(err);
    feed.innerHTML = `<div class="empty"><span class="big">⚠️</span>
      Firestore theke data load korte parlam na.<br>
      <span class="small">Rules check korun.</span></div>`;
  });
}

function renderFeed(){
  const posts = filterUid ? allPosts.filter(p => p.uid === filterUid) : allPosts;

  if (!posts.length){
    renderedSigs.clear();
    feed.innerHTML = `<div class="empty"><span class="big">🌠</span>
      Ekhono kono wish nei.<br><span class="small">Prothom wish ta apni likhun!</span></div>`;
    return;
  }
  if (feed.querySelector('.empty')) feed.innerHTML = '';

  const seen = new Set();

  posts.forEach(p => {
    seen.add(p.id);
    const sig = JSON.stringify([
      p.text, p.imageUrl, p.likeCount, (p.likes || []).length,
      p.commentCount, p.editedAt, p.showProfile,
      p.authorName, p.authorPhoto, p.anonymous, p.createdAt
    ]);

    const existing = feed.querySelector(`.post[data-id="${p.id}"]`);
    if (existing && renderedSigs.get(p.id) === sig) return;

    const tmp = document.createElement('div');
    tmp.innerHTML = renderPost(p);
    const el = tmp.firstElementChild;

    if (existing) existing.replaceWith(el);
    else feed.appendChild(el);

    renderedSigs.set(p.id, sig);
  });

  // remove deleted posts
  [...feed.querySelectorAll('.post')].forEach(el => {
    if (!seen.has(el.dataset.id)){
      el.remove();
      renderedSigs.delete(el.dataset.id);
    }
  });

  // keep order
  posts.forEach(p => {
    const el = feed.querySelector(`.post[data-id="${p.id}"]`);
    if (el) feed.appendChild(el);
  });

  // re-render open comment sections
  openComments.forEach(id => renderCommentsFor(id));
}

function renderPost(p){
  const mine  = p.uid === currentUser?.uid;
  const likes = p.likes || [];
  const liked = currentUser ? likes.includes(currentUser.uid) : false;

  const name  = p.anonymous ? 'Anonymous' : (p.authorName || 'Guest');
  const photo = p.anonymous ? '' : (p.authorPhoto || '');

  return `
  <article class="post card" data-id="${p.id}">
    <div class="post-head">
      ${avatarHTML(p.anonymous ? '?' : name, photo)}
      <div class="post-meta">
        <div class="post-name">${esc(name)}${p.anonymous ? ' <span class="tag">anon</span>' : ''}</div>
        <div class="post-time">${timeAgo(p.createdAt)}${p.editedAt ? ' · edited' : ''}</div>
      </div>
      ${mine ? `<div>
        <button class="icon-btn" data-act="edit-post" title="Edit">✏️</button>
        <button class="icon-btn" data-act="delete-post" title="Delete">🗑️</button>
      </div>` : ''}
    </div>

    ${p.text ? `<div class="post-body">${esc(p.text)}</div>` : ''}

    ${p.imageUrl ? `<div class="post-image"><img src="${esc(p.imageUrl)}" loading="lazy" alt=""></div>` : ''}

    ${(p.showProfile && !p.anonymous) ? `
      <div class="profile-card">
        <div class="pc-label">Shared Profile</div>
        <div class="pc-row">
          ${avatarHTML(name, photo)}
          <div>
            <div class="pc-name">${esc(name)}</div>
            <a class="pc-link" href="?user=${esc(p.uid)}">View profile →</a>
          </div>
        </div>
      </div>` : ''}

    <div class="post-stats">
      <span>❤️ ${Math.max(0, p.likeCount || 0)} likes</span>
      <span>💬 ${Math.max(0, p.commentCount || 0)} comments</span>
    </div>

    <div class="post-actions">
      <button class="act ${liked ? 'liked' : ''}" data-act="like">${liked ? '❤️' : '🤍'} Like</button>
      <button class="act" data-act="toggle-comments">💬 Comment</button>
      <button class="act" data-act="share">🔗 Share</button>
    </div>

    <div class="comments" id="comments-${p.id}" ${openComments.has(p.id) ? '' : 'hidden'}></div>
  </article>`;
}

/* ---------------- Comments ---------------- */
function subscribeComments(postId){
  if (commentUnsubs.has(postId)) return;
  const q = query(collection(db, 'posts', postId, 'comments'), orderBy('createdAt', 'asc'));
  const unsub = onSnapshot(q, (snap) => {
    commentsCache.set(postId, snap.docs.map(d => ({ id: d.id, ...d.data() })));
    renderCommentsFor(postId);
  }, err => console.error('comments:', err));
  commentUnsubs.set(postId, unsub);
}

function renderCommentsFor(postId){
  const container = document.getElementById('comments-' + postId);
  if (!container) return;

  const list = commentsCache.get(postId) || [];
  const byParent = new Map();
  list.forEach(c => {
    const k = c.parentId || 'root';
    if (!byParent.has(k)) byParent.set(k, []);
    byParent.get(k).push(c);
  });

  const buildTree = (key) => {
    const kids = byParent.get(key) || [];
    if (!kids.length) return '';
    return `<div class="c-children">${kids.map(c => renderComment(c, postId, byParent)).join('')}</div>`;
  };

  container.innerHTML = `
    <div class="comment-form">
      <textarea class="comment-input" data-key="${postId}:root" rows="1"
        placeholder="Write a comment..."></textarea>
      <button class="btn small primary" data-act="add-comment">Send</button>
    </div>
    ${buildTree('root') || '<p class="muted small" style="margin:0">No comments yet. Prothom comment apni korun!</p>'}
  `;

  container.querySelectorAll('.comment-input').forEach(t => {
    const v = drafts.get(t.dataset.key);
    if (v) t.value = v;
  });
}

function renderComment(c, postId, byParent){
  const mine  = c.uid === currentUser?.uid;
  const name  = c.anonymous ? 'Anonymous' : (c.authorName || 'Guest');
  const photo = c.anonymous ? '' : (c.authorPhoto || '');
  const kids  = byParent.get(c.id) || [];

  return `
  <div class="comment" data-comment-id="${c.id}">
    <div class="c-head">
      ${avatarHTML(c.anonymous ? '?' : name, photo, 'sm')}
      <span class="c-name">${esc(name)}</span>
      <span class="c-time">${timeAgo(c.createdAt)}${c.editedAt ? ' · edited' : ''}</span>
    </div>
    <div class="c-body">${esc(c.text)}</div>
    <div class="c-actions">
      <button data-act="reply-comment">Reply</button>
      ${mine ? `<button data-act="edit-comment">Edit</button>
                <button data-act="delete-comment">Delete</button>` : ''}
    </div>
    <div class="c-reply hidden" data-open="0"></div>
    ${kids.length ? `<div class="c-children">${kids.map(k => renderComment(k, postId, byParent)).join('')}</div>` : ''}
  </div>`;
}

/* ---------------- Composer ---------------- */
imageInput.addEventListener('change', () => {
  const f = imageInput.files[0];
  if (!f) return;
  if (f.size > 5 * 1024 * 1024){
    toast('Image 5MB er beshi hobe na');
    imageInput.value = '';
    return;
  }
  selectedFile = f;
  previewImg.src = URL.createObjectURL(f);
  previewWrap.classList.remove('hidden');
});

$('removeImg').addEventListener('click', () => {
  selectedFile = null;
  imageInput.value = '';
  previewImg.src = '';
  previewWrap.classList.add('hidden');
});

anonToggle.addEventListener('change', () => {
  if (anonToggle.checked){
    profileToggle.checked = false;
    profileToggle.disabled = true;
  } else {
    profileToggle.disabled = false;
  }
});

postBtn.addEventListener('click', async () => {
  if (!currentUser) return;
  const text = wishText.value.trim();
  if (!text && !selectedFile){ toast('Wish likhun ba ekta image din'); return; }

  postBtn.disabled = true;
  postBtn.textContent = 'Posting...';

  try {
    let imageUrl = '', imagePath = '';

    if (selectedFile){
      const path = `posts/${currentUser.uid}/${Date.now()}_${selectedFile.name}`;
      const r = sRef(storage, path);
      await uploadBytes(r, selectedFile);
      imageUrl  = await getDownloadURL(r);
      imagePath = path;
    }

    const anon = anonToggle.checked;

    await addDoc(collection(db, 'posts'), {
      uid         : currentUser.uid,
      authorName  : anon ? 'Anonymous' : myProfile.name,
      authorPhoto : anon ? '' : myProfile.photo,
      anonymous   : anon,
      showProfile : anon ? false : profileToggle.checked,
      text,
      imageUrl,
      imagePath,
      likes       : [],
      likeCount   : 0,
      commentCount: 0,
      createdAt   : serverTimestamp(),
      editedAt    : null
    });

    // reset
    wishText.value = '';
    selectedFile = null;
    imageInput.value = '';
    previewImg.src = '';
    previewWrap.classList.add('hidden');
    anonToggle.checked = false;
    profileToggle.checked = false;
    profileToggle.disabled = false;

    toast('Wish post hoye geche ✨');
  } catch (e){
    console.error(e);
    toast('Post korte parlam na — abar try korun');
  } finally {
    postBtn.disabled = false;
    postBtn.textContent = 'Post Wish';
  }
});

/* ---------------- Feed interactions ---------------- */
feed.addEventListener('input', (e) => {
  if (e.target.classList.contains('comment-input')){
    drafts.set(e.target.dataset.key, e.target.value);
  }
});

feed.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;

  const act    = btn.dataset.act;
  const postEl = btn.closest('.post');
  if (!postEl) return;

  const postId = postEl.dataset.id;
  const post   = allPosts.find(p => p.id === postId);
  if (!post) return;

  /* ---------- LIKE ---------- */
  if (act === 'like'){
    if (!currentUser) return;
    const liked = (post.likes || []).includes(currentUser.uid);
    try {
      await updateDoc(doc(db, 'posts', postId), {
        likes    : liked ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid),
        likeCount: increment(liked ? -1 : 1)
      });
    } catch (err){ console.error(err); }
    return;
  }

  /* ---------- SHARE ---------- */
  if (act === 'share'){
    const url = `${location.origin}${location.pathname}?post=${postId}`;
    try {
      await navigator.clipboard.writeText(url);
      toast('Link copied 🔗');
    } catch { prompt('Copy this link:', url); }
    return;
  }

  /* ---------- TOGGLE COMMENTS ---------- */
  if (act === 'toggle-comments'){
    const box = document.getElementById('comments-' + postId);
    if (openComments.has(postId)){
      openComments.delete(postId);
      box.hidden = true;
    } else {
      openComments.add(postId);
      box.hidden = false;
      subscribeComments(postId);
      renderCommentsFor(postId);
    }
    return;
  }

  /* ---------- EDIT POST ---------- */
  if (act === 'edit-post'){
    if (postEl.querySelector('.edit-box')) return;
    const bodyEl = postEl.querySelector('.post-body');
    const box = document.createElement('div');
    box.className = 'edit-box';
    box.innerHTML = `
      <textarea rows="3" maxlength="1000"></textarea>
      <div class="row">
        <button class="btn small primary" data-act="save-post">Save</button>
        <button class="btn small ghost" data-act="cancel-edit">Cancel</button>
      </div>`;
    box.querySelector('textarea').value = post.text || '';

    if (bodyEl) bodyEl.replaceWith(box);
    else postEl.querySelector('.post-head').after(box);

    box.querySelector('textarea').focus();
    return;
  }

  if (act === 'save-post'){
    const ta = postEl.querySelector('.edit-box textarea');
    const val = ta.value.trim();
    if (!val){ toast('Wish khali rakha jabe na'); return; }
    try {
      await updateDoc(doc(db, 'posts', postId), {
        text: val, editedAt: serverTimestamp()
      });
      toast('Updated ✅');
    } catch (err){ console.error(err); toast('Update fail holo'); }
    return;
  }

  if (act === 'cancel-edit'){
    renderedSigs.delete(postId);
    renderFeed();
    return;
  }

  /* ---------- DELETE POST ---------- */
  if (act === 'delete-post'){
    if (!confirm('Ei wish ta delete korben?')) return;
    try {
      const cs = await getDocs(collection(db, 'posts', postId, 'comments'));
      await Promise.all(cs.docs.map(d => deleteDoc(d.ref)));

      if (post.imagePath){
        try { await deleteObject(sRef(storage, post.imagePath)); } catch {}
      }
      await deleteDoc(doc(db, 'posts', postId));

      if (commentUnsubs.has(postId)){
        commentUnsubs.get(postId)();
        commentUnsubs.delete(postId);
        commentsCache.delete(postId);
      }
      openComments.delete(postId);
      renderedSigs.delete(postId);
      toast('Deleted 🗑️');
    } catch (err){ console.error(err); toast('Delete korte parlam na'); }
    return;
  }

  /* ---------- ADD COMMENT ---------- */
  if (act === 'add-comment'){
    const ta = postEl.querySelector('.comment-form .comment-input');
    const val = ta.value.trim();
    if (!val){ toast('Comment likhun'); return; }
    ta.value = '';
    drafts.delete(`${postId}:root`);
    await addComment(postId, null, val);
    return;
  }

  /* ---------- REPLY ---------- */
  if (act === 'reply-comment'){
    const cEl = btn.closest('.comment');
    const box = cEl.querySelector(':scope > .c-reply');
    if (box.dataset.open === '1'){
      box.classList.add('hidden');
      box.dataset.open = '0';
      return;
    }
    box.dataset.open = '1';
    box.classList.remove('hidden');
    const cid = cEl.dataset.commentId;
    box.innerHTML = `
      <textarea class="comment-input" data-key="${postId}:${cid}" rows="2"
        placeholder="Reply likhun..."></textarea>
      <div class="row">
        <button class="btn small primary" data-act="send-reply" data-parent="${cid}">Reply</button>
        <button class="btn small ghost" data-act="cancel-reply">Cancel</button>
      </div>`;
    const ta = box.querySelector('textarea');
    ta.value = drafts.get(`${postId}:${cid}`) || '';
    ta.focus();
    return;
  }

  if (act === 'cancel-reply'){
    const cEl = btn.closest('.comment');
    const box = cEl.querySelector(':scope > .c-reply');
    box.classList.add('hidden');
    box.dataset.open = '0';
    box.innerHTML = '';
    return;
  }

  if (act === 'send-reply'){
    const parentId = btn.dataset.parent;
    const cEl = btn.closest('.comment');
    const ta  = cEl.querySelector(':scope > .c-reply textarea');
    const val = ta.value.trim();
    if (!val){ toast('Reply likhun'); return; }
    ta.value = '';
    drafts.delete(`${postId}:${parentId}`);
    await addComment(postId, parentId, val);
    return;
  }

  /* ---------- EDIT COMMENT ---------- */
  if (act === 'edit-comment'){
    const cEl  = btn.closest('.comment');
    const body = cEl.querySelector(':scope > .c-body');
    if (cEl.querySelector(':scope > .c-edit')) return;

    const box = document.createElement('div');
    box.className = 'c-edit';
    box.style.margin = '6px 0 0 34px';
    box.innerHTML = `
      <textarea class="comment-input" rows="2"></textarea>
      <div class="row">
        <button class="btn small primary" data-act="save-comment">Save</button>
        <button class="btn small ghost" data-act="cancel-comment-edit">Cancel</button>
      </div>`;
    box.querySelector('textarea').value = body.textContent;
    body.replaceWith(box);
    box.querySelector('textarea').focus();
    return;
  }

  if (act === 'save-comment'){
    const cEl = btn.closest('.comment');
    const cid = cEl.dataset.commentId;
    const val = cEl.querySelector('.c-edit textarea').value.trim();
    if (!val){ toast('Comment khali hobe na'); return; }
    try {
      await updateDoc(doc(db, 'posts', postId, 'comments', cid), {
        text: val, editedAt: serverTimestamp()
      });
    } catch (err){ console.error(err); toast('Update fail'); }
    return;
  }

  if (act === 'cancel-comment-edit'){
    renderCommentsFor(postId);
    return;
  }

  /* ---------- DELETE COMMENT (nested) ---------- */
  if (act === 'delete-comment'){
    if (!confirm('Ei comment ta (sathe er reply gulo) delete korben?')) return;
    const cid = btn.closest('.comment').dataset.commentId;
    try {
      const snap = await getDocs(collection(db, 'posts', postId, 'comments'));
      const all  = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      const toDelete = new Set([cid]);
      let changed = true;
      while (changed){
        changed = false;
        all.forEach(c => {
          if (c.parentId && toDelete.has(c.parentId) && !toDelete.has(c.id)){
            toDelete.add(c.id);
            changed = true;
          }
        });
      }

      await Promise.all([...toDelete].map(id =>
        deleteDoc(doc(db, 'posts', postId, 'comments', id))
      ));
      await updateDoc(doc(db, 'posts', postId), {
        commentCount: increment(-toDelete.size)
      });
      toast('Comment deleted');
    } catch (err){ console.error(err); toast('Delete fail'); }
    return;
  }
});

/* ---------------- Comment create ---------------- */
async function addComment(postId, parentId, text){
  if (!currentUser) return;
  const anon = anonToggle.checked;   // composer er anon toggle comment eo kaj korbe
  try {
    await addDoc(collection(db, 'posts', postId, 'comments'), {
      uid        : currentUser.uid,
      authorName : anon ? 'Anonymous' : myProfile.name,
      authorPhoto: anon ? '' : myProfile.photo,
      anonymous  : anon,
      text,
      parentId   : parentId || null,
      createdAt  : serverTimestamp(),
      editedAt   : null
    });
    await updateDoc(doc(db, 'posts', postId), { commentCount: increment(1) });
  } catch (e){
    console.error(e);
    toast('Comment add korte parlam na');
  }
}

/* ---------------- Auto-grow textareas ---------------- */
feed.addEventListener('input', (e) => {
  if (e.target.tagName === 'TEXTAREA' && e.target.classList.contains('comment-input')){
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
  }
});

/* ---------------- Deep link (#post-xxx) ---------------- */
window.addEventListener('load', () => {
  const m = location.hash.match(/^#post-(.+)$/);
  if (m){
    setTimeout(() => {
      const el = document.querySelector(`.post[data-id="${m[1]}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 1200);
  }
});
</script>
