<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wishes ✨</title>
<style>
  :root{
    --bg:#0d0e1a; --card:#171832; --card2:#1f2040;
    --text:#ecedf7; --muted:#9295b8;
    --accent:#7c5cff; --accent2:#ff5c8a;
    --border:#2a2c50; --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali',sans-serif;
    background:
      radial-gradient(900px 500px at 8% -8%, #2b1f63 0%, transparent 60%),
      radial-gradient(800px 460px at 100% 0%, #4c1c46 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  textarea,input{font-family:inherit;}
  .hidden{display:none !important;}

  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; gap:8px;
    padding:12px 14px;
    background:rgba(13,14,26,.78);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .brand{
    font-size:1.25rem; font-weight:800; letter-spacing:.3px;
    background:linear-gradient(90deg,#a78bfa,#ff7ab6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .spacer{flex:1;}

  .btn{
    border:1px solid transparent; border-radius:12px;
    padding:9px 16px; font-size:.9rem; font-weight:600;
    transition:.18s; white-space:nowrap;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; box-shadow:0 6px 18px -6px var(--accent);
  }
  .btn.primary:hover{filter:brightness(1.12); transform:translateY(-1px);}
  .btn.ghost{background:transparent; color:var(--muted); border-color:var(--border);}
  .btn.ghost:hover{color:var(--text); border-color:var(--accent);}
  .btn.google{
    background:#fff; color:#333; border:none; padding:8px 14px;
    display:inline-flex; align-items:center; gap:7px; font-weight:700;
  }
  .btn.google:hover{background:#f0f0f0; transform:translateY(-1px);}
  .btn.small{padding:6px 12px; font-size:.8rem; border-radius:9px;}
  .btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}

  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--card2); border:1px solid var(--border);
    border-radius:999px; padding:5px 14px 5px 5px; color:var(--text);
    font-weight:600; font-size:.85rem; transition:.18s;
  }
  .profile-chip:hover{border-color:var(--accent);}

  .avatar{
    width:40px; height:40px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem; color:#fff; overflow:hidden;
    background:#3b3d68;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar.sm{width:26px;height:26px;font-size:.72rem;}

  .container{max-width:680px; margin:0 auto; padding:20px 14px 80px;}

  .card{
    background:linear-gradient(180deg,var(--card),#141530);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 18px 40px -28px #000;
  }

  .composer{padding:16px; margin-bottom:18px;}
  .composer textarea{
    width:100%; min-height:92px; resize:vertical;
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:1.02rem; line-height:1.55;
  }
  .composer textarea::placeholder{color:#5d6088;}

  .preview-wrap{position:relative; margin:10px 0;}
  .preview-wrap img{
    width:100%; max-height:280px; object-fit:cover;
    border-radius:12px; border:1px solid var(--border); display:block;
  }
  .preview-wrap .remove{
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,.65); color:#fff; border:none;
    width:30px; height:30px; border-radius:50%; font-size:1rem; line-height:1;
  }

  .composer-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    border-top:1px solid var(--border); padding-top:12px; margin-top:6px;
  }
  .file-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.85rem; font-weight:600; color:var(--muted);
    border:1px dashed var(--border); border-radius:10px;
    padding:7px 12px; cursor:pointer; transition:.18s;
  }
  .file-btn:hover{color:var(--text); border-color:var(--accent);}
  .check{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.83rem; color:var(--muted); cursor:pointer; user-select:none;
  }
  .check input{accent-color:var(--accent); width:15px; height:15px;}

  .banner{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(255,92,138,.16));
    border:1px solid var(--border); border-radius:14px;
    padding:12px 16px; margin-bottom:16px; font-size:.9rem;
  }

  .post{padding:16px; margin-bottom:16px; animation:pop .28s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .post-head{display:flex; align-items:center; gap:11px;}
  .post-meta{flex:1; min-width:0;}
  .post-name{font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .post-time{font-size:.76rem; color:var(--muted); margin-top:2px;}
  .tag{
    font-size:.62rem; font-weight:700; letter-spacing:.5px;
    background:rgba(255,92,138,.18); color:#ff9dc0;
    padding:2px 7px; border-radius:99px;
  }
  .icon-btn{
    background:transparent; border:none; font-size:.95rem;
    padding:6px; border-radius:8px; opacity:.7; transition:.15s;
  }
  .icon-btn:hover{opacity:1; background:var(--card2);}

  .post-body{
    margin-top:13px; font-size:1rem; line-height:1.65;
    word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap;
  }
  .post-image{margin-top:13px;}
  .post-image img{
    width:100%; max-height:460px; object-fit:cover;
    border-radius:13px; border:1px solid var(--border); display:block;
  }

  .profile-card{
    margin-top:13px; padding:11px 13px; border-radius:13px;
    background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(255,92,138,.10));
    border:1px solid var(--border);
  }
  .pc-label{
    font-size:.65rem; letter-spacing:1px;
    color:var(--muted); font-weight:700;
  }
  .pc-row{display:flex; align-items:center; gap:11px; margin-top:8px;}
  .pc-name{font-weight:700; font-size:.92rem;}
  .pc-link{font-size:.78rem; color:#a78bfa; text-decoration:none;}
  .pc-link:hover{text-decoration:underline;}

  .post-stats{
    display:flex; gap:14px; margin-top:12px;
    font-size:.76rem; color:var(--muted);
  }

  .post-actions{
    display:flex; gap:6px; margin-top:10px;
    border-top:1px solid var(--border); padding-top:10px;
  }
  .act{
    flex:1; background:transparent; border:none; border-radius:10px;
    padding:8px 6px; font-size:.84rem; font-weight:600; color:var(--muted);
    transition:.15s;
  }
  .act:hover{background:var(--card2); color:var(--text);}
  .act.liked{color:#ff6b9d;}

  .edit-box{margin-top:12px;}
  .edit-box textarea{
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:11px; color:var(--text); padding:11px 13px;
    font-size:.95rem; resize:vertical; outline:none;
  }
  .edit-box textarea:focus{border-color:var(--accent);}
  .row{display:flex; gap:8px; margin-top:9px; align-items:center; flex-wrap:wrap;}
  .row.end{justify-content:flex-end;}

  .comments{
    margin-top:14px; border-top:1px solid var(--border); padding-top:13px;
  }
  .comment-form{display:flex; gap:8px; align-items:flex-start; margin-bottom:13px;}
  .comment-input{
    flex:1; background:var(--card2); border:1px solid var(--border);
    border-radius:11px; padding:9px 13px; color:var(--text);
    font-size:.88rem; resize:vertical; outline:none; min-height:40px;
    width:100%;
  }
  .comment-input:focus{border-color:var(--accent);}
  .comment-input::placeholder{color:#5d6088;}

  .c-children{margin-left:18px; padding-left:12px; border-left:2px solid var(--border);}
  .c-children .c-children .c-children{margin-left:8px;}
  .comment{padding:9px 0;}
  .c-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .c-name{font-weight:700; font-size:.83rem;}
  .c-time{font-size:.72rem; color:var(--muted);}
  .c-body{
    margin:6px 0 0 34px; font-size:.88rem; line-height:1.55;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .c-actions{display:flex; gap:12px; margin:6px 0 0 34px; flex-wrap:wrap;}
  .c-actions button{
    background:none; border:none; padding:0; font-size:.74rem;
    font-weight:600; color:var(--muted); transition:.15s;
  }
  .c-actions button:hover{color:var(--accent);}
  .c-reply{margin:9px 0 4px 34px;}

  .modal-backdrop{
    position:fixed; inset:0; z-index:200;
    background:rgba(5,5,14,.72); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal{
    width:100%; max-width:400px; padding:22px;
    background:linear-gradient(180deg,var(--card),#131428);
    border:1px solid var(--border); border-radius:20px;
    box-shadow:0 30px 70px -30px #000;
    animation:pop .22s ease;
    max-height:90vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 16px; font-size:1.1rem;}
  .modal-avatar{display:flex; justify-content:center; margin-bottom:16px;}
  .modal-avatar .avatar{width:74px; height:74px; font-size:1.7rem;}
  .field{display:block; margin-bottom:14px;}
  .field span{display:block; font-size:.78rem; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input[type=text], .field input:not([type]){
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:11px; padding:10px 13px; color:var(--text);
    font-size:.92rem; outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .field input[type=file]{font-size:.82rem; color:var(--muted);}

  .auth-box{
    text-align:center; padding:56px 24px;
  }
  .auth-box h2{margin:0 0 8px; font-size:1.4rem;}
  .auth-box p{color:var(--muted); margin:0 0 22px; font-size:.9rem;}
  .auth-box .btn{font-size:.95rem; padding:12px 22px;}

  .muted{color:var(--muted);}
  .small{font-size:.82rem;}
  .empty{
    text-align:center; padding:56px 20px; color:var(--muted);
    border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty .big{font-size:2.6rem; display:block; margin-bottom:10px;}

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,140%);
    background:#242649; color:#fff; padding:11px 22px; border-radius:99px;
    font-size:.86rem; font-weight:600; border:1px solid var(--border);
    box-shadow:0 14px 34px -14px #000; z-index:500;
    transition:transform .32s cubic-bezier(.2,.9,.3,1.3);
    max-width:90vw; text-align:center;
  }
  #toast.show{transform:translate(-50%,0);}

  @media (max-width:520px){
    .composer-row{gap:9px;}
    .act{font-size:.78rem;}
    .profile-chip #myName{display:none;}
    .profile-chip{padding:5px;}
    .topbar{gap:6px; padding:10px 12px;}
    .btn.small{padding:6px 9px; font-size:.75rem;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">✨ Wishes</div>
  <div class="spacer"></div>
  <button id="langToggle" class="btn ghost small">EN</button>
  <button id="signInGoogle" class="btn google small hidden">
    <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
    Google
  </button>
  <button id="shareProfileBtn" class="btn ghost small hidden" data-i18n="shareProfile">🔗 Share</button>
  <button id="profileBtn" class="profile-chip hidden">
    <span id="myAvatarWrap"><span class="avatar sm">?</span></span>
    <span id="myName">Guest</span>
  </button>
</header>

<main class="container">

  <!-- Auth gate -->
  <section id="authGate" class="card auth-box hidden">
    <div class="brand" style="font-size:1.8rem; margin-bottom:12px;">✨ Wishes</div>
    <h2 data-i18n="authTitle">স্বাগতম!</h2>
    <p data-i18n="authSubtitle">আপনার উইশ শেয়ার করতে সাইন ইন করুন</p>
    <button id="googleSignInBtn" class="btn google" style="margin:0 auto 10px;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      <span data-i18n="signInGoogle">Google দিয়ে সাইন ইন</span>
    </button>
    <button id="guestSignInBtn" class="btn ghost" style="width:100%;">
      <span data-i18n="continueGuest">অতিথি হিসেবে চালিয়ে যান</span>
    </button>
  </section>

  <!-- Main app -->
  <div id="appMain" class="hidden">

    <section class="composer card">
      <textarea id="wishText" maxlength="1000" data-i18n-placeholder="postPlaceholder"
        placeholder="আপনার উইশ লিখুন... ✨"></textarea>

      <div id="previewWrap" class="preview-wrap hidden">
        <img id="previewImg" alt="">
        <button class="remove" id="removeImg" title="Remove">✕</button>
      </div>

      <div class="composer-row">
        <label class="file-btn">
          🖼️ <span data-i18n="image">ছবি</span>
          <input type="file" id="imageInput" accept="image/*" hidden>
        </label>
        <label class="check"><input type="checkbox" id="anonToggle"> <span data-i18n="anonymous">বেনামী</span></label>
        <label class="check"><input type="checkbox" id="profileCardToggle"> <span data-i18n="attachProfile">প্রোফাইল যুক্ত</span></label>
        <div class="spacer"></div>
        <button id="postBtn" class="btn primary" data-i18n="postWish">উইশ পোস্ট করুন</button>
      </div>
    </section>

    <div id="filterBanner" class="banner hidden"></div>

    <section id="feed"></section>
  </div>
</main>

<!-- Profile modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h3 data-i18n="myProfile">আমার প্রোফাইল</h3>
    <div class="modal-avatar"><span id="modalAvatar"></span></div>

    <label class="field">
      <span data-i18n="displayName">প্রদর্শিত নাম</span>
      <input id="nameInput" maxlength="30" placeholder="Your name">
    </label>

    <label class="field">
      <span data-i18n="avatarImage">প্রোফাইল ছবি</span>
      <input type="file" id="avatarInput" accept="image/*">
    </label>

    <div class="row end">
      <button class="btn ghost" id="closeModal" data-i18n="cancel">বাতিল</button>
      <button class="btn primary" id="saveProfile" data-i18n="save">সেভ</button>
    </div>
    <div class="row" style="justify-content:center; margin-top:14px;">
      <button class="btn ghost small hidden" id="signOutBtn" data-i18n="signOut">সাইন আউট</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">

import {

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* ---------- i18n ---------- */
const I18N = {
  bn: {
    shareProfile:'🔗 শেয়ার', signInGoogle:'Google দিয়ে সাইন ইন',
    continueGuest:'অতিথি হিসেবে চালিয়ে যান',
    authTitle:'স্বাগতম!', authSubtitle:'আপনার উইশ শেয়ার করতে সাইন ইন করুন',
    postPlaceholder:'আপনার উইশ লিখুন... ✨', image:'ছবি', anonymous:'বেনামী',

    myProfile:'আমার প্রোফাইল', displayName:'প্রদর্শিত নাম', avatarImage:'প্রোফাইল ছবি',

    writeComment:'একটি কমেন্ট লিখুন...', writeReply:'উত্তর লিখুন...',
    send:'পাঠান', reply:'উত্তর', edit:'সম্পাদনা', delete:'মুছুন',
    justNow:'এইমাত্র', minAgo:m=>`${m} মিনিট আগে`, hrAgo:h=>`${h} ঘণ্টা আগে`,

let lang = localStorage.getItem('wishes-lang') || 'bn';
const t = (k, arg) => {
  const v = I18N[lang][k];
  return typeof v === 'function' ? v(arg) : (v || k);
};
function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $('langToggle').textContent = lang === 'bn' ? 'EN' : 'বাং';
  $('postBtn').textContent = t('postWish');
}

/* ---------- Helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function timeAgo(ts){
  if (!ts) return t('justNow');
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 45) return t('justNow');
  if (s < 3600) return t('minAgo', Math.floor(s/60));
  if (s < 86400) return t('hrAgo', Math.floor(s/3600));
  if (s < 604800) return t('dayAgo', Math.floor(s/86400));
  return d.toLocaleDateString(lang === 'bn' ? 'bn-BD' : 'en-US');
}
function avatarHTML(name, photo, cls=''){
  if (photo) return `<span class="avatar ${cls}"><img src="${esc(photo)}" alt=""></span>`;
  const ch = (name||'?').trim().charAt(0).toUpperCase() || '?';
  const hue = [...(name||'x')].reduce((a,c)=>a+c.charCodeAt(0),0) % 360;
  return `<span class="avatar ${cls}" style="background:hsl(${hue} 58% 42%)">${esc(ch)}</span>`;
}

async function compressImage(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim){
          if (w >= h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else       { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

/* ---------- AUTH ---------- */
onAuthStateChanged(auth, async (user) => {
  if (user){
    currentUser = user;
    try { await loadProfile(); } catch(e){ console.error(e); }
    showApp();
    if (!feedUnsub) startFeed();
    await buildFilterBanner();
    updateAuthUI();
  } else {
    currentUser = null;
    if (feedUnsub){ feedUnsub(); feedUnsub = null; }
    // Try auto anonymous sign-in
    try {
      await signInAnonymously(auth);
      // onAuthStateChanged fires again with the new user
    } catch (e){
      console.error('Auto anonymous sign-in failed:', e);
      showAuthGate();
      updateAuthUI();
      if (e.code === 'auth/operation-not-allowed'){
        toast(t('anonDisabled'));
      } else if (e.code === 'auth/network-request-failed'){
        toast(t('netErr'));
      } else {
        toast(t('signInFail') + ': ' + (e.code || e.message));
      }
    }
  }
});

function showApp(){
  $('authGate').classList.add('hidden');
  $('appMain').classList.remove('hidden');
  $('profileBtn').classList.remove('hidden');
  $('shareProfileBtn').classList.remove('hidden');
}
function showAuthGate(){
  $('authGate').classList.remove('hidden');
  $('appMain').classList.add('hidden');
  $('profileBtn').classList.add('hidden');
  $('shareProfileBtn').classList.add('hidden');
  feed.innerHTML = '';
  renderedSigs.clear();
}
function updateAuthUI(){
  const btn = $('signInGoogle');
  if (!currentUser){ btn.classList.add('hidden'); return; }
  if (currentUser.isAnonymous) btn.classList.remove('hidden');
  else btn.classList.add('hidden');
}

async function doGoogleSignIn(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    let result;
    if (currentUser && currentUser.isAnonymous){
      try {
        result = await linkWithPopup(currentUser, provider);
      } catch (e){
        if (e.code === 'auth/credential-already-in-use' ||
            e.code === 'auth/email-already-in-use'){
          result = await signInWithPopup(auth, provider);
        } else if (e.code === 'auth/popup-closed-by-user' ||
                   e.code === 'auth/cancelled-popup-request'){
          return;
        } else throw e;
      }
    } else {
      result = await signInWithPopup(auth, provider);
    }
    const u = result.user;
    const snap = await getDoc(doc(db, 'users', u.uid));
    const existingName = snap.exists() ? (snap.data().name || '') : '';
    if (!existingName || existingName.startsWith('Guest')){
      await setDoc(doc(db, 'users', u.uid), {
        name: u.displayName || 'User',
        photo: u.photoURL || '',
        email: u.email || '',
        updatedAt: serverTimestamp()
      }, { merge: true });
      await loadProfile();
    }
    toast(t('welcome') + ' ' + (u.displayName || ''));
  } catch (err){
    console.error('Google sign-in error:', err);
    if (err.code === 'auth/popup-blocked') toast('Popup blocked — allow popups');
    else if (err.code === 'auth/unauthorized-domain') toast('Domain not authorized');
    else toast(t('googleSignInError'));
  }
}
$('googleSignInBtn').addEventListener('click', doGoogleSignIn);
$('signInGoogle').addEventListener('click', doGoogleSignIn);
$('guestSignInBtn').addEventListener('click', async () => {
  try { await signInAnonymously(auth); }
  catch (e){
    console.error('guest sign-in:', e);
    if (e.code === 'auth/operation-not-allowed') toast(t('anonDisabled'));
    else toast(t('signInFail') + ': ' + (e.code || e.message));
  }
});
$('signOutBtn').addEventListener('click', async () => {
  if (!confirm(t('signOutConfirm'))) return;
  try {
    await signOut(auth);
    $('modalBackdrop').classList.add('hidden');
    // Auth listener will re-sign in anonymously on its own
  } catch(e){ console.error(e); }
});

/* ---------- PROFILE ---------- */
async function loadProfile(){
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()){
      const d = snap.data();
      myProfile = { name: d.name || 'Guest', photo: d.photo || '' };
    } else {
      myProfile = { name: 'Guest-' + currentUser.uid.slice(0,4).toUpperCase(), photo: '' };
      await setDoc(doc(db, 'users', currentUser.uid), {
        ...myProfile, createdAt: serverTimestamp()
      });
    }
  } catch (e){
    console.error('loadProfile:', e);
    myProfile = { name:'Guest', photo:'' };
  }
  renderMyChip();
}
function renderMyChip(){
  $('myAvatarWrap').innerHTML = avatarHTML(myProfile.name, myProfile.photo, 'sm');
  $('myName').textContent = myProfile.name;
}

$('profileBtn').addEventListener('click', () => {
  pendingAvatar = null;
  $('nameInput').value = myProfile.name;
  $('avatarInput').value = '';
  $('modalAvatar').innerHTML = avatarHTML(myProfile.name, myProfile.photo);
  if (currentUser && !currentUser.isAnonymous) $('signOutBtn').classList.remove('hidden');
  else $('signOutBtn').classList.add('hidden');

});

});
$('avatarInput').addEventListener('change', () => {

  if (f.size > 5*1024*1024){ toast(t('imageTooBig')); $('avatarInput').value=''; return; }
  pendingAvatar = f;
  $('modalAvatar').innerHTML = `<span class="avatar"><img src="${URL.createObjectURL(f)}" alt=""></span>`;
});
$('saveProfile').addEventListener('click', async () => {
  const name = $('nameInput').value.trim() || myProfile.name;
  const btn = $('saveProfile');
  btn.disabled = true; btn.textContent = '...';
  try {
    let photo = myProfile.photo;
    if (pendingAvatar) photo = await compressImage(pendingAvatar, 320, 0.82);
    await setDoc(doc(db, 'users', currentUser.uid),
      { name, photo, updatedAt: serverTimestamp() }, { merge: true });
    myProfile = { name, photo };
    renderMyChip();
    $('modalBackdrop').classList.add('hidden');
    toast(t('profileUpdated'));
  } catch (e){
    console.error('saveProfile:', e);
    toast(t('profileError'));
  } finally {
    btn.disabled = false; btn.textContent = t('save');
  }
});
$('shareProfileBtn').addEventListener('click', async () => {
  if (!currentUser) return;
  const url = `${location.origin}${location.pathname}?user=${currentUser.uid}`;
  try { await navigator.clipboard.writeText(url); toast(t('linkCopied')); }

async function buildFilterBanner(){
  if (!filterUid){ filterBanner.classList.add('hidden'); return; }
  let name = '...';
  try {
    const s = await getDoc(doc(db, 'users', filterUid));
    if (s.exists()) name = s.data().name || name;
  } catch {}
  filterBanner.innerHTML = `
    <span>🔎 ${esc(t('showingFrom'))} <b>${esc(name)}</b>${esc(t('userWishesOf'))}</span>
    <div class="spacer"></div>
    <button class="btn ghost small" id="clearFilter">${esc(t('showAll'))}</button>`;

  $('clearFilter').addEventListener('click', () => {
    filterUid = null;

    filterBanner.classList.add('hidden');
    renderedSigs.clear();
    feed.innerHTML = '';
    renderFeed();
  });
}

/* ---------- FEED ---------- */
function startFeed(){
  const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
  feedUnsub = onSnapshot(q, snap => {
    allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFeed();
  }, err => {
    console.error('feed error:', err);
    feed.innerHTML = `<div class="empty"><span class="big">⚠️</span>
      <span>Firestore load failed — rules check করুন।</span></div>`;
  });
}

function renderFeed(){
  const posts = filterUid ? allPosts.filter(p => p.uid === filterUid) : allPosts;

  if (!posts.length){
    renderedSigs.clear();
    feed.innerHTML = `<div class="empty"><span class="big">🌠</span>
      <b>${esc(t('noPosts'))}</b><br>
      <span class="small">${esc(t('noPostsSub'))}</span></div>`;
    return;
  }
  if (feed.querySelector('.empty')) feed.innerHTML = '';

  const seen = new Set();
  posts.forEach(p => {
    seen.add(p.id);
    const liked = currentUser ? (p.likes || []).includes(currentUser.uid) : false;
    const sig = JSON.stringify([
      lang, p.text, p.imageUrl, p.likeCount || 0, liked,
      p.commentCount || 0, p.editedAt, p.showProfile,
      p.authorName, p.authorPhoto, p.anonymous, p.createdAt
    ]);
    const existing = feed.querySelector(`.post[data-id="${p.id}"]`);
    if (existing && renderedSigs.get(p.id) === sig) return;

    const tmp = document.createElement('div');
    tmp.innerHTML = renderPost(p);
    const el = tmp.firstElementChild;
    if (existing) existing.replaceWith(el);
    else feed.appendChild(el);
    renderedSigs.set(p.id, sig);
  });

  [...feed.querySelectorAll('.post')].forEach(el => {
    if (!seen.has(el.dataset.id)){ el.remove(); renderedSigs.delete(el.dataset.id); }
  });
  posts.forEach(p => {
    const el = feed.querySelector(`.post[data-id="${p.id}"]`);
    if (el) feed.appendChild(el);
  });
  openComments.forEach(id => renderCommentsFor(id));
}

function renderPost(p){
  const mine = p.uid === currentUser?.uid;
  const likes = p.likes || [];
  const liked = currentUser ? likes.includes(currentUser.uid) : false;
  const likeCount = Math.max(0, likes.length);           // ← derive from array!
  const commentCount = Math.max(0, p.commentCount || 0);
  const name = p.anonymous ? t('guest') : (p.authorName || t('guest'));
  const photo = p.anonymous ? '' : (p.authorPhoto || '');
  const displayName = p.anonymous ? t('anon') : name;

  return `
  <article class="post card" data-id="${p.id}">
    <div class="post-head">
      ${avatarHTML(p.anonymous ? '?' : name, photo)}
      <div class="post-meta">
        <div class="post-name">${esc(displayName)}${p.anonymous ? ` <span class="tag">${esc(t('anon'))}</span>` : ''}</div>
        <div class="post-time">${timeAgo(p.createdAt)}${p.editedAt ? ' · ' + esc(t('edited')) : ''}</div>
      </div>
      ${mine ? `<div>
        <button class="icon-btn" data-act="edit-post" title="${esc(t('edit'))}">✏️</button>
        <button class="icon-btn" data-act="delete-post" title="${esc(t('delete'))}">🗑️</button>
      </div>` : ''}
    </div>
    ${p.text ? `<div class="post-body">${esc(p.text)}</div>` : ''}
    ${p.imageUrl ? `<div class="post-image"><img src="${esc(p.imageUrl)}" loading="lazy" alt=""></div>` : ''}
    ${(p.showProfile && !p.anonymous) ? `
      <div class="profile-card">
        <div class="pc-label">${esc(t('sharedProfile'))}</div>
        <div class="pc-row">
          ${avatarHTML(name, photo)}
          <div>
            <div class="pc-name">${esc(name)}</div>
            <a class="pc-link" href="?user=${esc(p.uid)}">${esc(t('viewProfile'))}</a>
          </div>
        </div>
      </div>` : ''}
    <div class="post-stats">
      <span>❤️ ${likeCount} ${esc(t('likes'))}</span>
      <span>💬 ${commentCount} ${esc(t('comments'))}</span>
    </div>
    <div class="post-actions">
      <button class="act ${liked ? 'liked' : ''}" data-act="like">
        ${liked ? '❤️' : '🤍'} ${esc(liked ? t('liked') : t('like'))}
      </button>
      <button class="act" data-act="toggle-comments">💬 ${esc(t('comment'))}</button>
      <button class="act" data-act="share">🔗 ${esc(t('share'))}</button>
    </div>
    <div class="comments" id="comments-${p.id}" ${openComments.has(p.id) ? '' : 'hidden'}></div>
  </article>`;
}

/* ---------- COMMENTS ---------- */
function subscribeComments(postId){
  if (commentUnsubs.has(postId)) return;
  const q = query(collection(db, 'posts', postId, 'comments'), orderBy('createdAt', 'asc'));
  const unsub = onSnapshot(q, snap => {
    commentsCache.set(postId, snap.docs.map(d => ({ id: d.id, ...d.data() })));
    renderCommentsFor(postId);
    // Keep the displayed count in sync with reality
    const box = document.getElementById('comments-' + postId);
    if (box){
      const postEl = box.closest('.post');
      const stats = postEl?.querySelector('.post-stats span:nth-child(2)');
      if (stats) stats.textContent = `💬 ${snap.size} ${t('comments')}`;
    }
  }, err => console.error('comments:', err));
  commentUnsubs.set(postId, unsub);
}

function renderCommentsFor(postId){
  const container = document.getElementById('comments-' + postId);
  if (!container) return;

  const list = commentsCache.get(postId) || [];
  const byParent = new Map();
  list.forEach(c => {
    const k = c.parentId || 'root';
    if (!byParent.has(k)) byParent.set(k, []);
    byParent.get(k).push(c);
  });

  const buildTree = key => {
    const kids = byParent.get(key) || [];
    if (!kids.length) return '';
    return `<div class="c-children">${kids.map(c => renderComment(c, byParent)).join('')}</div>`;
  };

  container.innerHTML = `
    <div class="comment-form">
      <textarea class="comment-input" data-key="${postId}:root" rows="1"
        placeholder="${esc(t('writeComment'))}"></textarea>
      <button class="btn small primary" data-act="add-comment">${esc(t('send'))}</button>
    </div>
    ${buildTree('root') || `<p class="muted small" style="margin:0">${esc(t('noComments'))}</p>`}`;

  container.querySelectorAll('.comment-input').forEach(tx => {
    const v = drafts.get(tx.dataset.key);
    if (v) tx.value = v;
  });
}

function renderComment(c, byParent){
  const mine = c.uid === currentUser?.uid;
  const name = c.anonymous ? t('guest') : (c.authorName || t('guest'));
  const photo = c.anonymous ? '' : (c.authorPhoto || '');
  const displayName = c.anonymous ? t('anon') : name;
  const kids = byParent.get(c.id) || [];

  return `
  <div class="comment" data-comment-id="${c.id}">
    <div class="c-head">
      ${avatarHTML(c.anonymous ? '?' : name, photo, 'sm')}
      <span class="c-name">${esc(displayName)}</span>
      <span class="c-time">${timeAgo(c.createdAt)}${c.editedAt ? ' · ' + esc(t('edited')) : ''}</span>
    </div>
    <div class="c-body">${esc(c.text)}</div>
    <div class="c-actions">
      <button data-act="reply-comment">${esc(t('reply'))}</button>
      ${mine ? `<button data-act="edit-comment">${esc(t('edit'))}</button>
                <button data-act="delete-comment">${esc(t('delete'))}</button>` : ''}
    </div>
    <div class="c-reply hidden" data-open="0"></div>
    ${kids.length ? `<div class="c-children">${kids.map(k => renderComment(k, byParent)).join('')}</div>` : ''}
  </div>`;
}

/* ---------- ATOMIC operations ---------- */
async function toggleLike(postId){
  if (!currentUser) return;
  const ref = doc(db, 'posts', postId);
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists()) return;
      const likes = snap.data().likes || [];
      const uid = currentUser.uid;
      const idx = likes.indexOf(uid);
      const newLikes = idx >= 0
        ? likes.filter(x => x !== uid)
        : [...likes, uid];
      // likeCount is ALWAYS derived from the array — can never drift
      tx.update(ref, { likes: newLikes, likeCount: newLikes.length });
    });
  } catch (e){
    console.error('toggleLike:', e);
    toast(t('updateError'));
  }
}

async function addCommentAtomic(postId, parentId, text){
  if (!currentUser) return;
  const anon = anonToggle.checked;
  const postRef = doc(db, 'posts', postId);
  const commentRef = doc(collection(db, 'posts', postId, 'comments'));
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(postRef);
      if (!snap.exists()) throw new Error('post gone');
      const count = snap.data().commentCount || 0;
      tx.set(commentRef, {
        uid: currentUser.uid,
        authorName: anon ? 'Anonymous' : myProfile.name,
        authorPhoto: anon ? '' : myProfile.photo,
        anonymous: anon,
        text,
        parentId: parentId || null,
        createdAt: serverTimestamp(),
        editedAt: null
      });
      tx.update(postRef, { commentCount: count + 1 });
    });
  } catch (e){
    console.error('addComment:', e);
    toast(t('postError'));
  }
}

async function deleteCommentTreeAtomic(postId, rootId){
  const postRef = doc(db, 'posts', postId);
  const commentsCol = collection(db, 'posts', postId, 'comments');
  try {
    const snap = await getDocs(commentsCol);
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const toDelete = new Set([rootId]);
    let changed = true;
    while (changed){
      changed = false;
      all.forEach(c => {
        if (c.parentId && toDelete.has(c.parentId) && !toDelete.has(c.id)){
          toDelete.add(c.id);
          changed = true;
        }
      });
    }
    await runTransaction(db, async (tx) => {
      const postSnap = await tx.get(postRef);
      if (!postSnap.exists()) return;
      const count = postSnap.data().commentCount || 0;
      toDelete.forEach(id => tx.delete(doc(db, 'posts', postId, 'comments', id)));
      tx.update(postRef, { commentCount: Math.max(0, count - toDelete.size) });
    });
    toast(t('deleted'));
  } catch (e){
    console.error('deleteComment:', e);
    toast(t('deleteError'));
  }
}

/* ---------- COMPOSER ---------- */
imageInput.addEventListener('change', () => {
  const f = imageInput.files[0];
  if (!f) return;
  if (f.size > 8*1024*1024){ toast(t('imageTooBig')); imageInput.value = ''; return; }
  selectedFile = f;
  previewImg.src = URL.createObjectURL(f);
  previewWrap.classList.remove('hidden');
});
$('removeImg').addEventListener('click', () => {
  selectedFile = null; imageInput.value = ''; previewImg.src = '';
  previewWrap.classList.add('hidden');
});
anonToggle.addEventListener('change', () => {
  if (anonToggle.checked){ profileToggle.checked = false; profileToggle.disabled = true; }
  else profileToggle.disabled = false;
});

postBtn.addEventListener('click', async () => {
  if (!currentUser) return;
  const text = wishText.value.trim();
  if (!text && !selectedFile){ toast(t('wishRequired')); return; }

  postBtn.disabled = true; postBtn.textContent = t('posting');
  try {
    let imageUrl = '';
    if (selectedFile){
      imageUrl = await compressImage(selectedFile, 1100, 0.72);
      if (imageUrl.length > 950000){
        toast(t('imageTooBig'));
        return;
      }
    }
    const anon = anonToggle.checked;
    await addDoc(collection(db, 'posts'), {
      uid: currentUser.uid,
      authorName: anon ? 'Anonymous' : myProfile.name,
      authorPhoto: anon ? '' : myProfile.photo,
      anonymous: anon,
      showProfile: anon ? false : profileToggle.checked,
      text, imageUrl,
      likes: [], likeCount: 0, commentCount: 0,
      createdAt: serverTimestamp(), editedAt: null
    });
    wishText.value = ''; selectedFile = null; imageInput.value = '';
    previewImg.src = ''; previewWrap.classList.add('hidden');
    anonToggle.checked = false; profileToggle.checked = false; profileToggle.disabled = false;
    toast(t('postSuccess'));
  } catch (e){
    console.error('post error:', e);
    toast(t('postError'));
  } finally {
    postBtn.disabled = false; postBtn.textContent = t('postWish');
  }
});

/* ---------- FEED interactions ---------- */
feed.addEventListener('input', e => {
  if (e.target.classList.contains('comment-input')){
    drafts.set(e.target.dataset.key, e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
  }
});

feed.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const postEl = btn.closest('.post');
  if (!postEl) return;
  const postId = postEl.dataset.id;
  const post = allPosts.find(p => p.id === postId);
  if (!post) return;

  if (act === 'like'){ await toggleLike(postId); return; }

  if (act === 'share'){
    const url = `${location.origin}${location.pathname}?post=${postId}`;
    try { await navigator.clipboard.writeText(url); toast(t('linkCopied')); }
    catch { prompt(t('copyPrompt'), url); }
    return;
  }

  if (act === 'toggle-comments'){
    const box = document.getElementById('comments-' + postId);
    if (openComments.has(postId)){
      openComments.delete(postId);
      box.hidden = true;
    } else {
      openComments.add(postId);
      box.hidden = false;
      subscribeComments(postId);
      renderCommentsFor(postId);
    }
    return;
  }

  if (act === 'edit-post'){
    if (postEl.querySelector('.edit-box')) return;
    const bodyEl = postEl.querySelector('.post-body');
    const box = document.createElement('div');
    box.className = 'edit-box';
    box.innerHTML = `
      <textarea rows="3" maxlength="1000"></textarea>
      <div class="row end">
        <button class="btn small ghost" data-act="cancel-edit">${esc(t('cancel'))}</button>
        <button class="btn small primary" data-act="save-post">${esc(t('save'))}</button>
      </div>`;
    box.querySelector('textarea').value = post.text || '';
    if (bodyEl) bodyEl.replaceWith(box);
    else postEl.querySelector('.post-head').after(box);
    box.querySelector('textarea').focus();
    return;
  }

  if (act === 'save-post'){
    const val = postEl.querySelector('.edit-box textarea').value.trim();
    if (!val){ toast(t('wishRequired')); return; }
    try {
      await updateDoc(doc(db, 'posts', postId), { text: val, editedAt: serverTimestamp() });
      toast(t('updated'));
    } catch (err){ console.error(err); toast(t('updateError')); }
    return;
  }

  if (act === 'cancel-edit'){ renderedSigs.delete(postId); renderFeed(); return; }

  if (act === 'delete-post'){
    if (!confirm(t('confirmDeletePost'))) return;
    try {
      const cs = await getDocs(collection(db, 'posts', postId, 'comments'));
      await Promise.all(cs.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(db, 'posts', postId));
      if (commentUnsubs.has(postId)){
        commentUnsubs.get(postId)(); commentUnsubs.delete(postId); commentsCache.delete(postId);
      }
      openComments.delete(postId); renderedSigs.delete(postId);
      toast(t('deleted'));
    } catch (err){ console.error(err); toast(t('deleteError')); }
    return;
  }

  if (act === 'add-comment'){
    const ta = postEl.querySelector('.comment-form .comment-input');
    const val = ta.value.trim();
    if (!val){ toast(t('commentRequired')); return; }
    ta.value = '';
    drafts.delete(`${postId}:root`);
    await addCommentAtomic(postId, null, val);
    return;
  }

  if (act === 'reply-comment'){
    const cEl = btn.closest('.comment');
    const box = cEl.querySelector(':scope > .c-reply');
    if (box.dataset.open === '1'){
      box.classList.add('hidden'); box.dataset.open = '0'; return;
    }
    box.dataset.open = '1'; box.classList.remove('hidden');
    const cid = cEl.dataset.commentId;
    box.innerHTML = `
      <textarea class="comment-input" data-key="${postId}:${cid}" data-reply="1" rows="2"
        placeholder="${esc(t('writeReply'))}"></textarea>
      <div class="row end">
        <button class="btn small ghost" data-act="cancel-reply">${esc(t('cancel'))}</button>
        <button class="btn small primary" data-act="send-reply" data-parent="${cid}">${esc(t('send'))}</button>
      </div>`;
    const ta = box.querySelector('textarea');
    ta.value = drafts.get(`${postId}:${cid}`) || '';
    ta.focus();
    return;
  }

  if (act === 'cancel-reply'){
    const cEl = btn.closest('.comment');
    const box = cEl.querySelector(':scope > .c-reply');
    box.classList.add('hidden'); box.dataset.open = '0'; box.innerHTML = '';
    return;
  }

  if (act === 'send-reply'){
    const parentId = btn.dataset.parent;
    const cEl = btn.closest('.comment');
    const ta = cEl.querySelector(':scope > .c-reply textarea');
    const val = ta.value.trim();
    if (!val){ toast(t('replyRequired')); return; }
    ta.value = ''; drafts.delete(`${postId}:${parentId}`);
    await addCommentAtomic(postId, parentId, val);
    return;
  }

  if (act === 'edit-comment'){
    const cEl = btn.closest('.comment');
    const body = cEl.querySelector(':scope > .c-body');
    if (cEl.querySelector(':scope > .c-edit')) return;
    const box = document.createElement('div');
    box.className = 'c-edit';
    box.style.margin = '6px 0 0 34px';
    box.innerHTML = `
      <textarea class="comment-input" rows="2"></textarea>
      <div class="row end">
        <button class="btn small ghost" data-act="cancel-comment-edit">${esc(t('cancel'))}</button>
        <button class="btn small primary" data-act="save-comment">${esc(t('save'))}</button>
      </div>`;
    box.querySelector('textarea').value = body.textContent;
    body.replaceWith(box);
    box.querySelector('textarea').focus();
    return;
  }

  if (act === 'save-comment'){
    const cEl = btn.closest('.comment');
    const cid = cEl.dataset.commentId;
    const val = cEl.querySelector('.c-edit textarea').value.trim();
    if (!val){ toast(t('commentRequired')); return; }
    try {
      await updateDoc(doc(db, 'posts', postId, 'comments', cid),
        { text: val, editedAt: serverTimestamp() });
      toast(t('updated'));
    } catch (err){ console.error(err); toast(t('updateError')); }
    return;
  }

  if (act === 'cancel-comment-edit'){ renderCommentsFor(postId); return; }

  if (act === 'delete-comment'){
    if (!confirm(t('confirmDeleteComment'))) return;
    const cid = btn.closest('.comment').dataset.commentId;
    await deleteCommentTreeAtomic(postId, cid);
    return;
  }
});

/* ---------- Boot ---------- */
applyI18n();
</script>
