<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wishes ✨</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">✨ Wishes</div>
  <div class="spacer"></div>
  <button id="langToggle" class="btn ghost small">EN</button>
  <button id="signInGoogle" class="btn google small hidden">
    <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
    Google
  </button>
  <button id="shareProfileBtn" class="btn ghost small hidden" data-i18n="shareProfile">🔗 Share</button>
  <button id="profileBtn" class="profile-chip hidden">
    <span id="myAvatarWrap"><span class="avatar sm">?</span></span>
    <span id="myName">Guest</span>
  </button>
</header>

<main class="container">

  <!-- Auth gate -->
  <section id="authGate" class="card auth-box hidden">
    <div class="brand" style="font-size:1.8rem; margin-bottom:12px;">✨ Wishes</div>
    <h2 data-i18n="authTitle">স্বাগতম!</h2>
    <p data-i18n="authSubtitle">আপনার উইশ শেয়ার করতে সাইন ইন করুন</p>
    <button id="googleSignInBtn" class="btn google" style="margin:0 auto 10px;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      <span data-i18n="signInGoogle">Google দিয়ে সাইন ইন</span>
    </button>
    <button id="guestSignInBtn" class="btn ghost" style="width:100%;">
      <span data-i18n="continueGuest">অতিথি হিসেবে চালিয়ে যান</span>
    </button>
  </section>

  <!-- Main app -->
  <div id="appMain" class="hidden">

    <section class="composer card">
      <textarea id="wishText" maxlength="1000" data-i18n-placeholder="postPlaceholder"
        placeholder="আপনার উইশ লিখুন... ✨"></textarea>

      <div id="previewWrap" class="preview-wrap hidden">
        <img id="previewImg" alt="">
        <button class="remove" id="removeImg" title="Remove">✕</button>
      </div>

      <div class="composer-row">
        <label class="file-btn">
          🖼️ <span data-i18n="image">ছবি</span>
          <input type="file" id="imageInput" accept="image/*" hidden>
        </label>
        <label class="check"><input type="checkbox" id="anonToggle"> <span data-i18n="anonymous">বেনামী</span></label>
        <label class="check"><input type="checkbox" id="profileCardToggle"> <span data-i18n="attachProfile">প্রোফাইল যুক্ত</span></label>
        <div class="spacer"></div>
        <button id="postBtn" class="btn primary" data-i18n="postWish">উইশ পোস্ট করুন</button>
      </div>
    </section>

    <div id="filterBanner" class="banner hidden"></div>

    <section id="feed"></section>
  </div>
</main>

<!-- Profile modal -->
<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal">
    <h3 data-i18n="myProfile">আমার প্রোফাইল</h3>
    <div class="modal-avatar"><span id="modalAvatar"></span></div>

    <label class="field">
      <span data-i18n="displayName">প্রদর্শিত নাম</span>
      <input id="nameInput" maxlength="30" placeholder="Your name">
    </label>

    <label class="field">
      <span data-i18n="avatarImage">প্রোফাইল ছবি</span>
      <input type="file" id="avatarInput" accept="image/*">
    </label>

    <div class="row end">
      <button class="btn ghost" id="closeModal" data-i18n="cancel">বাতিল</button>
      <button class="btn primary" id="saveProfile" data-i18n="save">সেভ</button>
    </div>
    <div class="row" style="justify-content:center; margin-top:14px;">
      <button class="btn ghost small hidden" id="signOutBtn" data-i18n="signOut">সাইন আউট</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
